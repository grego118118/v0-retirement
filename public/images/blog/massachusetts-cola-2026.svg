<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="950" cy="150" r="180" fill="url(#accentGrad)" opacity="0.1"/>
  <circle cx="1050" cy="450" r="120" fill="url(#goldGrad)" opacity="0.08"/>
  <circle cx="150" cy="500" r="100" fill="url(#accentGrad)" opacity="0.06"/>
  
  <!-- Year badge -->
  <rect x="80" y="100" width="180" height="70" rx="12" fill="url(#goldGrad)"/>
  <text x="170" y="148" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0d1b2a" text-anchor="middle">2026</text>
  
  <!-- Main title -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white">Massachusetts</text>
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white">COLA Update</text>
  
  <!-- Subtitle -->
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="26" fill="#94a3b8">Cost of Living Adjustment Guide</text>
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="26" fill="#94a3b8">for State Employee Pensions</text>
  
  <!-- Key stats boxes -->
  <g transform="translate(80, 470)">
    <rect width="160" height="80" rx="8" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#60a5fa" text-anchor="middle">3%</text>
    <text x="80" y="60" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">COLA Rate</text>
  </g>
  
  <g transform="translate(260, 470)">
    <rect width="160" height="80" rx="8" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fbbf24" text-anchor="middle">$390</text>
    <text x="80" y="60" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Max Annual</text>
  </g>
  
  <g transform="translate(440, 470)">
    <rect width="160" height="80" rx="8" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="2"/>
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4ade80" text-anchor="middle">$13K</text>
    <text x="80" y="60" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Base Cap</text>
  </g>
  
  <!-- Chart visualization -->
  <g transform="translate(700, 180)">
    <rect width="420" height="280" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Bar chart -->
    <rect x="50" y="200" width="50" height="40" fill="url(#accentGrad)" rx="4"/>
    <rect x="120" y="170" width="50" height="70" fill="url(#accentGrad)" rx="4"/>
    <rect x="190" y="140" width="50" height="100" fill="url(#accentGrad)" rx="4"/>
    <rect x="260" y="110" width="50" height="130" fill="url(#accentGrad)" rx="4"/>
    <rect x="330" y="80" width="50" height="160" fill="url(#goldGrad)" rx="4"/>
    
    <!-- Labels -->
    <text x="75" y="260" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">2022</text>
    <text x="145" y="260" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">2023</text>
    <text x="215" y="260" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">2024</text>
    <text x="285" y="260" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">2025</text>
    <text x="355" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">2026</text>
    
    <text x="210" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Cumulative COLA Growth</text>
  </g>
  
  <!-- Mass Pension branding -->
  <text x="1120" y="600" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="end">masspension.com</text>
</svg>
